[project]
name = "kmu-library-mcp"
version = "0.1.0"
description = "MCP Server for KMU Library (高雄醫學大學圖書資訊處)"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
